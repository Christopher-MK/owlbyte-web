<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OlwByte | Estudio Creativo</title>
    
    <!-- Preload crítico -->
    <link rel="preload" href="css/main.css" as="style">
    <link rel="preload" href="js/main.js" as="script">
    
    <!-- CSS Modular -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <!-- Meta tags SEO -->
    <meta name="description" content="Estudio creativo especializado en diseño UI/UX, branding y desarrollo web premium">
    <meta name="author" content="OlwByte">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:title" content="OlwByte | Estudio Creativo">
    <meta property="og:description" content="Diseño que conecta, código que transforma">
    <meta property="og:image" content="assets/images/og-image.jpg">
    <meta property="og:url" content="https://tu-usuario.github.io/olwbyte-portfolio">
    
    <!-- Fuentes optimizadas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Contenedor de carga dinámica -->
    <div id="app">
        <!-- Los componentes se cargarán aquí -->
    </div>

    <!-- Template principal -->
    <template id="main-template">
        <!-- Header (se cargará dinámicamente) -->
        <div id="header-container"></div>
        
        <!-- Main Content -->
        <main>
            <section id="inicio" class="hero-section"></section>
            <section id="servicios" class="services-section"></section>
            <section id="portafolio" class="portfolio-section"></section>
            <section id="about" class="about-section"></section>
            <section id="contacto" class="contact-section"></section>
        </main>
        
        <!-- Footer -->
        <div id="footer-container"></div>
        
        <!-- Modales -->
        <div id="modal-container"></div>
    </template>

    <!-- Scripts modulares -->
    <script src="js/utils/helpers.js" type="module"></script>
    <script src="js/modules/component-loader.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
