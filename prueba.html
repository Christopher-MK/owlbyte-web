<!DOCTYPE html>
<html>
<body style="margin:0; background:radial-gradient(circle at 30% 20%,#0f0c29,#302b63,#24243e); display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Poppins',system-ui;">
    <div style="background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); border-radius:40px; padding:50px 70px; text-align:center; border:1px solid rgba(255,255,255,0.2); box-shadow:0 20px 50px rgba(0,0,0,0.3);">
        <h1 style="font-size:5em; margin:0; background:linear-gradient(135deg,#FFD700,#FF6B6B,#4ECDC4); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 5px 10px rgba(0,0,0,0.3));">👾</h1>
        <button style="background:linear-gradient(90deg,#FF6B6B,#4ECDC4); color:white; border:none; padding:15px 50px; font-size:1.3em; font-weight:bold; border-radius:60px; cursor:pointer; margin-top:30px; transition:0.3s; box-shadow:0 8px 20px rgba(0,0,0,0.3); letter-spacing:2px;" onmouseover="this.style.transform='scale(1.08)'; this.style.letterSpacing='4px';" onmouseout="this.style.transform='scale(1)'; this.style.letterSpacing='2px';" onclick="this.innerHTML='🚀'; setTimeout(()=>this.innerHTML='ENTRAR',600);">ENTRAR</button>
    </div>
</body>
</html>
