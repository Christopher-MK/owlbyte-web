<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #4682B4;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .neon-box {
            width: 300px;
            height: 300px;
            background: transparent;
            border: 3px solid #0ff;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff;
            border-radius: 20px;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
                border-color: #0ff;
            }
            100% {
                box-shadow: 0 0 40px #0ff, inset 0 0 30px #0ff;
                border-color: #f0f;
            }
        }
    </style>
</head>
<body>
    <div class="neon-box"></div>
</body>
</html>
