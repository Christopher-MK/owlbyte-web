<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
          background: linear-gradient(45deg, #000, #2a0a0a, #000);
            animation: bgPulse 3s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0% {
                background: linear-gradient(45deg, #000, #0a0a2a, #000);
            }
            50% {
                background: linear-gradient(45deg, #0a0a2a, #000, #0a0a2a);
            }
            100% {
                background: linear-gradient(45deg, #000, #0a0a2a, #000);
            }
        }
    </style>
</head>
<body>
</body>
</html>
