<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(45deg, #000, #2a0a0a, #4a0a0a, #2a0a0a, #000);
            animation: bgPulse 2s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0% {
                background: linear-gradient(45deg, #000, #2a0a0a, #4a0a0a, #2a0a0a, #000);
            }
            50% {
                background: linear-gradient(45deg, #2a0a0a, #4a0a0a, #8a0a0a, #4a0a0a, #2a0a0a);
            }
            100% {
                background: linear-gradient(45deg, #000, #2a0a0a, #4a0a0a, #2a0a0a, #000);
            }
        }
    </style>
</head>
<body>
</body>
</html>
